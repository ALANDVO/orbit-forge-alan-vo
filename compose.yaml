services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme_local_admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8000"
      HOST: "127.0.0.1"
      ENVIRONMENT: "development"
      DEMO_MODE: "true"
      DATABASE_URL: "sqlite:///./data/orbit_forge.db"
      OIDC_ISSUER_URL: "http://127.0.0.1:8080/realms/orbit-forge"
      OIDC_CLIENT_ID: "orbit-forge-app"
      OIDC_AUDIENCE: "orbit-forge-app"
      LLM_PROVIDER: "openai-compatible"
      LLM_MODEL: "gpt-4o-mini"
      LLM_API_KEY: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      keycloak:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_started

volumes:
  keycloak_data:
  backend_data:

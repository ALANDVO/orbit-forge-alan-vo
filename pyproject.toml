[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-forge-alan-vo"
version = "1.0.0"
description = "Intentional crafting engine for AI/ML generative workflows, local pipeline synthesis, and procedural PBR material generation"
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
